name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: build+test (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNEATCPP_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j 2

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure -j 2 --timeout 300

  sanitizers:
    name: sanitizers (Linux, Debug, ASan+UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with sanitizers
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DNEATCPP_ENABLE_TESTS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san -j 2

      - name: Test
        run: ctest --test-dir build-san --output-on-failure -j 2 --timeout 300

  format:
    name: format (clang-format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          pip install "clang-format==22.1.8"
          clang-format --dry-run --Werror src/*.h src/*.cpp tests/*.cxx

  coverage:
    name: coverage (Linux, GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with coverage
        run: >
          cmake -S . -B build-cov
          -DCMAKE_BUILD_TYPE=Debug
          -DNEATCPP_ENABLE_TESTS=ON
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build-cov -j 2

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure -j 2 --timeout 300

      - name: Report
        run: |
          pip install gcovr
          gcovr -r . --filter 'src/.*' --print-summary --xml coverage.xml --html-details coverage.html
          gcovr -r . --filter 'src/.*' --print-summary --fail-under-line 50
