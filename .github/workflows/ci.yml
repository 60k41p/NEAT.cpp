name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: build+test (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNEATCPP_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build build/ci --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.build_type }} --output-on-failure --parallel --timeout 600

  sanitizers:
    name: sanitizers (Linux, Debug, ASan+UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with sanitizers
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: >
          cmake -S . -B build/san
          -DCMAKE_BUILD_TYPE=Debug
          -DNEATCPP_ENABLE_TESTS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build/san --parallel

      - name: Test
        run: ctest --test-dir build/san --output-on-failure --parallel --timeout 600

  format:
    name: format (clang-format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          pip install "clang-format==22.1.8"
          clang-format --dry-run --Werror src/*.h src/*.cpp tests/*.cpp benchmarks/*.cpp

  coverage:
    name: coverage (Linux, GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with coverage
        run: >
          cmake -S . -B build/coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DNEATCPP_ENABLE_TESTS=ON
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build/coverage --parallel

      - name: Test
        run: ctest --test-dir build/coverage --output-on-failure --parallel --timeout 600

      - name: Report
        run: |
          pip install gcovr
          gcovr -r . --filter 'src/.*' --print-summary --xml coverage.xml --html-details coverage.html
          gcovr -r . --filter 'src/.*' --print-summary --fail-under-line 50
